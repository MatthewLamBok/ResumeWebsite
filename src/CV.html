    <style>
        .pdf-container {
            width: 100%;
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background: var(--card-background);
            transition: background 0.3s ease;
        }

        iframe {
            width: 100%;
            max-width: 900px;
            height: 100%;
            border: none;
            box-shadow: var(--shadow);
            background: white;
        }

        .error-message {
            text-align: center;
            padding: 2rem;
            color: var(--text-color);
        }

        .error-message a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <!-- Logo -->
